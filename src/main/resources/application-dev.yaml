
spring:
  config:
    activate:
      on-profile: dev

  # ----------------------------------------------
  # PostgreSQL - Local
  # ----------------------------------------------
  datasource:
    url: jdbc:postgresql://localhost:5432/string_dev
    username: ${USUARIO:dev}
    password: ${SENHA:dev123456}
    driver-class-name: org.postgresql.Driver

  # ----------------------------------------------
  # JPA / Hibernate
  # ----------------------------------------------
  jpa:
    show-sql: false
    open-in-view: false

    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        use_sql_comments: true

  # ----------------------------------------------
  # Flyway
  # ----------------------------------------------
  flyway:
    enabled: true
    locations:
      - classpath:db/migration

    default-schema: public
    encoding: UTF-8
    validate-on-migrate: true
    clean-disabled: true
    connect-retries: 5

    baseline-on-migrate: true
    baseline-version: "20261004.00"
    baseline-description: "String API - schema existente antes do Flyway"

  # ----------------------------------------------
  # Cache
  # ----------------------------------------------
  cache:
    type: redis

  # ----------------------------------------------
  # Redis - Docker WSL2
  # ----------------------------------------------
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

      repositories:
        enabled: false

# ----------------------------------------------
# MinIO - Docker WSL2
# ----------------------------------------------
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  bucket: ${MINIO_BUCKET:string-api}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}

# ----------------------------------------------
# OCR - Processamento de imagens
# ----------------------------------------------
ocr:
  enabled: true

  # Motor ativo: quarkus ou tesseract
  engine: ${OCR_ENGINE:quarkus}

  # --------------------------------------------
  # Microsservico Quarkus + PaddleOCR
  # --------------------------------------------
  quarkus:
    url: ${OCR_QUARKUS_URL:http://localhost:8081/api/v1/ocr/extrair}
    api-key: ${OCR_QUARKUS_API_KEY:dev-only-change-me}
    timeout-seconds: 240

  # --------------------------------------------
  # Tesseract - Motor alternativo
  # --------------------------------------------
  segunda-passagem: true

  tessdata:
    path: ${OCR_TESSDATA_PATH:./tessdata}
    language: por+eng

  # --------------------------------------------
  # Armazenamento de imagens
  # --------------------------------------------
  storage:
    provider: minio
    prefix: ocr/imagens

  # --------------------------------------------
  # Worker assincrono
  # --------------------------------------------
  worker:
    enabled: true
    delay-ms: 3000
    batch-size: 10

  # --------------------------------------------
  # Limites de processamento
  # --------------------------------------------
  processing:
    max-image-size: 15MB
    min-confidence: 0.70

# ----------------------------------------------
# Aplicacao DEV
# ----------------------------------------------
app:
  frontend-url: https://stringtecnologiadf.org:4200

  storage:
    path: documentos

# ----------------------------------------------
# Logging DEV
# ----------------------------------------------
logging:
  level:
    org.springframework.security: TRACE
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

    # Corrigido: ocr em vez de orc
    org.stringtecnologia.string_api.ocr: DEBUG

# ----------------------------------------------
# String Tecnologia DEV
# ----------------------------------------------
string:
  ordem-servico:
    consulta-base-url: ${ORDEM_SERVICO_CONSULTA_BASE_URL:https://stringtecnologiadf.org:4200/consulta/os}
