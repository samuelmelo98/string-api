spring:
  config:
    activate:
      on-profile: dev

  # ----------------------------------------------
  # PostgreSQL
  # ----------------------------------------------
  # Desenvolvimento local:
  # localhost:15432 -> string-dev-router -> PostgreSQL
  datasource:
    url: jdbc:postgresql://${NAME_SERVER:localhost}:${PORT:15432}/string_api
    username: ${USUARIO}
    password: ${SENHA}
    driver-class-name: org.postgresql.Driver

  # ----------------------------------------------
  # Flyway
  # ----------------------------------------------
  flyway:
    enabled: true

    locations:
      - classpath:db/migration

    default-schema: public
    encoding: UTF-8
    validate-on-migrate: true
    clean-disabled: true
    connect-retries: 5

    # Temporário enquanto introduzimos Flyway
    # em um banco que já possui schema.
    baseline-on-migrate: true
    baseline-version: "20261004.00"
    baseline-description: "String API - schema existente antes do Flyway"

  # ----------------------------------------------
  # Cache
  # ----------------------------------------------
  cache:
    type: redis

  # ----------------------------------------------
  # Redis
  # ----------------------------------------------
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

      # Não usamos RedisRepository/@RedisHash.
      # O autocomplete usa StringRedisTemplate.
      repositories:
        enabled: false


# ----------------------------------------------
# Aplicação DEV
# ----------------------------------------------
app:
  frontend-url: "https://stringtecnologiadf.org:4200"

  storage:
    path: documentos


# ----------------------------------------------
# Logging DEV
# ----------------------------------------------
logging:
  level:
    org.springframework.security: TRACE
    org.springframework.web: DEBUG


# ----------------------------------------------
# String Tecnologia DEV
# ----------------------------------------------
string:
  ordem-servico:
    consulta-base-url: "${ORDEM_SERVICO_CONSULTA_BASE_URL:https://stringtecnologiadf.org:4200/consulta/os}"