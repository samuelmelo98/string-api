
# ============================================================
# STRING TECNOLOGIA - APPLICATION
# Java 25 / Spring Boot 4.0.1
# Configuracoes compartilhadas entre DEV e PROD
# ============================================================

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: native

# ============================================================
# SPRING BOOT
# ============================================================
spring:

  # ----------------------------------------------------------
  # Carregamento do arquivo .env
  # Formato: CHAVE=VALOR
  # ----------------------------------------------------------
  config:
    import: optional:file:./.env[.properties]

  application:
    name: string-api

  profiles:
    default: dev

  # ----------------------------------------------------------
  # Upload de arquivos
  # ----------------------------------------------------------
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  # ----------------------------------------------------------
  # PostgreSQL
  # Pode ser sobrescrito por application-dev.yaml
  # ----------------------------------------------------------
  datasource:
    url: jdbc:postgresql://${NAME_SERVER:localhost}:${PORT:5432}/string_api
    username: ${USUARIO}
    password: ${SENHA}
    driver-class-name: org.postgresql.Driver

    hikari:
      connection-timeout: 60000

  # ----------------------------------------------------------
  # Hibernate / JPA
  # ----------------------------------------------------------
  jpa:
    hibernate:
      ddl-auto: none

    open-in-view: false
    show-sql: false

    properties:
      jakarta.persistence.query.timeout: 300000

  # ----------------------------------------------------------
  # Segurança OAuth2 / Keycloak
  # ----------------------------------------------------------
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:https://auth.stringtecnologiadf.org/realms/stringtecnologia/protocol/openid-connect/certs}

# ============================================================
# ARMAZENAMENTO
# ============================================================
storage:
  provider: minio

# ============================================================
# MINIO
# As credenciais sao fornecidas por variaveis de ambiente.
# ============================================================
minio:
  endpoint: ${MINIO_ENDPOINT:https://minio.cluster.stringtecnologiadf.org}
  bucket: ${MINIO_BUCKET:string-api}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}

# ============================================================
# OCR - PARAMETROS GERAIS
# Endpoints e motores especificos ficam nos perfis.
# ============================================================
ocr:
  enabled: ${OCR_ENABLED:true}
  engine: ${OCR_ENGINE:quarkus}

  storage:
    provider: minio
    prefix: ${OCR_STORAGE_PREFIX:ocr/imagens}

  processing:
    max-image-size: 15MB
    min-confidence: 0.70

# ============================================================
# LOGGING
# ============================================================
logging:
  level:
    root: INFO

    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN

  pattern:
    dateformat: dd/MM/yyyy HH:mm:ss.SSS

# ============================================================
# INTEGRACOES EXTERNAS
# ============================================================
api:

  # ----------------------------------------------------------
  # InfoSimples
  # ----------------------------------------------------------
  infosimples:
    api-base-url: ${URL}
    api-key: ${KEY}
    time-out: 30s

  # ----------------------------------------------------------
  # String Email
  # ----------------------------------------------------------
  string-email:
    api-base-url: ${STRING_EMAIL_URL:http://string-email:8080}

    token-url: ${STRING_EMAIL_TOKEN_URL:https://auth.stringtecnologiadf.org/realms/stringtecnologia/protocol/openid-connect/token}

    client-id: ${STRING_EMAIL_CLIENT_ID:string-api-email}
    client-secret: ${STRING_EMAIL_CLIENT_SECRET:}

    connect-timeout: ${STRING_EMAIL_CONNECT_TIMEOUT:5s}
    read-timeout: ${STRING_EMAIL_READ_TIMEOUT:15s}
    token-refresh-skew: ${STRING_EMAIL_TOKEN_REFRESH_SKEW:30s}

# ============================================================
# APLICACAO
# ============================================================
app:

  # ----------------------------------------------------------
  # Teste de envio de e-mail
  # ----------------------------------------------------------
  email-test:
    enabled: ${APP_EMAIL_TEST_ENABLED:false}
    to: ${APP_EMAIL_TEST_TO:}

  # ----------------------------------------------------------
  # Configuracao do Keycloak
  # ----------------------------------------------------------
  security:
    keycloak:
      client-id: string-api

  # ----------------------------------------------------------
  # Restricoes de arquivos
  # ----------------------------------------------------------
  storage:
    max-size: 10MB

    allowed-types:
      - application/pdf
      - image/png
      - image/jpeg

    allowed-extensions:
      - pdf
      - png
      - jpg
      - jpeg

# ============================================================
# STRING TECNOLOGIA
# ============================================================
string:
  empresa:
    nome: String Tecnologia
    cnpj: "${EMPRESA_CNPJ:48.851.932/0001-74}"
    telefone: "${EMPRESA_TELEFONE:55 (61) 3302-3957}"
    whatsapp: "${EMPRESA_WHATSAPP:55 (61) 99609-9684}"

# ============================================================
# WHATSAPP CLOUD API
# ============================================================
whatsapp:
  webhook:
    verify-token: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:}
