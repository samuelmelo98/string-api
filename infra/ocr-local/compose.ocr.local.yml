name: string-api-ocr-local
services:
  minio:
    image: string-minio:local
    command: server /data --console-address ':9001'
    restart: unless-stopped
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_LOCAL_USER:?Defina MINIO_LOCAL_USER no arquivo de ambiente}
      MINIO_ROOT_PASSWORD: ${MINIO_LOCAL_PASSWORD:?Defina MINIO_LOCAL_PASSWORD no arquivo de ambiente}
    volumes:
      - minio_data:/data
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    restart: 'no'
    depends_on:
      minio:
        condition: service_started
    entrypoint: ['/bin/sh','-c']
    command: >-
      until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do
        echo "Aguardando MinIO..."; sleep 2;
      done;
      mc mb --ignore-existing local/string-api &&
      echo "Bucket string-api pronto"
    environment:
      MINIO_ROOT_USER: ${MINIO_LOCAL_USER:?Defina MINIO_LOCAL_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_LOCAL_PASSWORD:?Defina MINIO_LOCAL_PASSWORD}
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server','--appendonly','yes']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD','redis-cli','ping']
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  minio_data:
  redis_data:
